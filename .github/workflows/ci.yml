name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify

      # Three runs, not two: an ordering bug driven by per-JVM hash randomization can agree twice
      # by chance. The fixture deliberately contains a security guard, a configuration property, and
      # a module with two coupling targets, because every layer must be covered by this gate.
      - name: Graph export is stable across runs
        run: |
          for i in 1 2 3; do
            java -jar apps/cli/target/repo-intel.jar inspect fixtures/sample-commerce -o run$i.graph.json
          done
          diff run1.graph.json run2.graph.json
          diff run2.graph.json run3.graph.json
          cp run1.graph.json first.graph.json

      - name: Every layer is present in the fixture graph
        run: |
          python3 - <<'PY'
          import json
          kinds = {n['kind'] for n in json.load(open('first.graph.json'))['nodes']}
          for required in ['SECURITY_GUARD', 'CONFIGURATION_PROPERTY', 'MODULE', 'BUSINESS_CAPABILITY', 'WORKFLOW', 'ENDPOINT']:
              assert required in kinds, f'{required} missing: the determinism gate would not cover its layer'
          PY

      - name: The rendered view is self-contained and reproducible
        run: |
          java -jar apps/cli/target/repo-intel.jar visualize fixtures/sample-commerce --scope OPERATIONAL -o view1.html
          java -jar apps/cli/target/repo-intel.jar visualize fixtures/sample-commerce --scope OPERATIONAL -o view2.html
          diff view1.html view2.html
          ! grep -q '<script src' view1.html
          ! grep -q 'cdn\.' view1.html
          java -jar apps/cli/target/repo-intel.jar visualize fixtures/sample-commerce --scope ARCHITECTURE --format GRAPHML -o view.graphml
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('view.graphml')"

      - name: Impact keeps its source-backed answer for the fixture
        run: |
          java -jar apps/cli/target/repo-intel.jar impact fixtures/sample-commerce PaymentService --depth 3 --risk | tee impact.txt
          grep -q 'POST /payments/authorize' impact.txt
          grep -q 'confidence 1.00' impact.txt
          grep -q 'RISK' impact.txt

      - name: Grounded question set still passes
        run: java -jar apps/cli/target/repo-intel.jar evaluate fixtures/sample-commerce evaluation/sample-commerce.questions.tsv --fail-under 1.0

      - name: A snapshot round-trips and an unchanged tree diffs empty
        run: |
          java -jar apps/cli/target/repo-intel.jar snapshot fixtures/sample-commerce -o baseline.snapshot.json
          java -jar apps/cli/target/repo-intel.jar diff fixtures/sample-commerce baseline.snapshot.json | tee diff.txt
          grep -q '+0/-0 nodes, +0/-0 edges, 0 re-resolved' diff.txt

      - name: An answer cites its evidence and withholds the rest
        run: |
          java -jar apps/cli/target/repo-intel.jar ask fixtures/sample-commerce "what breaks if PaymentService changes?" | tee ask.txt
          grep -q 'SUPPORTED CLAIMS' ask.txt
          grep -q 'evidence:' ask.txt

      - name: Context packet stays smaller than the full graph
        run: |
          java -jar apps/cli/target/repo-intel.jar context fixtures/sample-commerce PaymentService -o context.json
          python3 - <<'PY'
          import json
          graph = json.load(open('first.graph.json'))
          packet = json.load(open('context.json'))
          assert graph['version'] == packet['version'], 'writers disagree on schema version'
          assert packet['evidence'], 'context packet carries no evidence'
          assert len(packet['evidence']) < len(graph['edges']), 'context packet is not a reduction'
          for edge in packet['evidence']:
              assert edge['file'] and edge['line'] > 0, edge
          PY
