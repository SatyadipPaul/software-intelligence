name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify

      # A README drifts without breaking anything: a renamed flag, a new module, or a release that
      # moves the version on all leave it quietly wrong. This compares each claim it makes - commands,
      # flags, links, published versions, the module layout, the server's tools - with the code.
      - name: README matches the code
        run: python3 .github/scripts/readme_drift.py

      # Three runs, not two: an ordering bug driven by per-JVM hash randomization can agree twice
      # by chance. The fixture deliberately contains a security guard, a configuration property, and
      # a module with two coupling targets, because every layer must be covered by this gate.
      - name: Graph export is stable across runs
        run: |
          for i in 1 2 3; do
            java -jar apps/cli/target/repo-intel.jar inspect fixtures/sample-commerce -o run$i.graph.json
          done
          diff run1.graph.json run2.graph.json
          diff run2.graph.json run3.graph.json
          cp run1.graph.json first.graph.json

      - name: Every layer is present in the fixture graph
        run: |
          python3 - <<'PY'
          import json
          kinds = {n['kind'] for n in json.load(open('first.graph.json'))['nodes']}
          for required in ['SECURITY_GUARD', 'CONFIGURATION_PROPERTY', 'MODULE', 'BUSINESS_CAPABILITY', 'WORKFLOW', 'ENDPOINT']:
              assert required in kinds, f'{required} missing: the determinism gate would not cover its layer'
          PY

      - name: The rendered view is self-contained and reproducible
        run: |
          java -jar apps/cli/target/repo-intel.jar visualize fixtures/sample-commerce --scope OPERATIONAL -o view1.html
          java -jar apps/cli/target/repo-intel.jar visualize fixtures/sample-commerce --scope OPERATIONAL -o view2.html
          diff view1.html view2.html
          ! grep -q '<script src' view1.html
          ! grep -q 'cdn\.' view1.html
          java -jar apps/cli/target/repo-intel.jar visualize fixtures/sample-commerce --scope ARCHITECTURE --format GRAPHML -o view.graphml
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('view.graphml')"

      - name: Impact keeps its source-backed answer for the fixture
        run: |
          java -jar apps/cli/target/repo-intel.jar impact fixtures/sample-commerce PaymentService --depth 3 --risk | tee impact.txt
          grep -q 'POST /payments/authorize' impact.txt
          grep -q 'confidence 1.00' impact.txt
          grep -q 'RISK' impact.txt

      # --depth 4 because the exhaustive questions enumerate the full transitive answer, and
      # --baseline so a regression that makes the graph no better than grep is visible in the log.
      - name: Grounded question set still passes, with precision and a baseline
        run: |
          java -jar apps/cli/target/repo-intel.jar evaluate fixtures/sample-commerce             evaluation/sample-commerce.questions.tsv --depth 4 --baseline --fail-under 1.0 | tee evaluation.txt
          grep -q 'precision                    1.000' evaluation.txt
          python3 - <<'PY'
          import re
          text = open('evaluation.txt').read()
          graph, base = [float(m) for m in re.findall(r'structural accuracy \(recall\) ([0-9.]+)', text)]
          assert graph > base, f'the graph must beat naive text search: {graph} vs {base}'
          print(f'graph recall {graph} vs text-search baseline {base}')
          PY

      # The index tree is a derived artifact, so it inherits the graph's determinism guarantee or
      # it is not derived - a navigator's descent can only be compared across runs if the tree is.
      - name: Index tree is stable across runs and covers every type
        run: |
          for i in 1 2 3; do
            java -jar apps/cli/target/repo-intel.jar index fixtures/sample-commerce -o tree$i.json
          done
          diff tree1.json tree2.json
          diff tree2.json tree3.json
          python3 - <<'PY'
          import json
          tree = json.load(open('tree1.json'))
          graph = json.load(open('first.graph.json'))
          nodes = {n['id']: n for n in tree['nodes']}
          assert tree['graphFingerprint'], 'a tree with no fingerprint cannot be told from a stale one'
          graph_ids = {n['id'] for n in graph['nodes']}
          for node in tree['nodes']:
              assert node['id'].startswith('index:'), node['id']
              assert node['id'] not in graph_ids, f"tree id {node['id']} collides with a graph id"
              for covered in node['graphIds']:
                  assert covered in graph_ids, f"{node['id']} points at {covered}, which is not in the graph"
          # Every type the graph declares has to be reachable from the root, or navigation loses it.
          reachable, stack = set(), ['index:root']
          while stack:
              current = stack.pop()
              if current in reachable: continue
              reachable.add(current)
              stack.extend(nodes[current]['children'])
          covered = {c for r in reachable for c in nodes[r]['graphIds']}
          # Only types this repository declares: a JDK type is in the graph because something
          # referenced it, and the table of contents of a repository does not contain java.lang.
          declared = {e['to'] for e in graph['edges'] if e['kind'] == 'DECLARES'}
          missing = [i for i in graph_ids
                     if i.startswith('type:') and '#' not in i and '.field:' not in i
                     and i in declared and i not in covered]
          assert not missing, f'types this repository declares are unreachable from the tree root: {missing}'
          PY

      # Both retrieval paths land on the right symbol, and the tree is not allowed to be a
      # regression: a mode that cannot match flat retrieval has no business being in the product.
      - name: Tree retrieval is measured against the flat baseline
        run: |
          java -jar apps/cli/target/repo-intel.jar evaluate fixtures/sample-commerce \
            evaluation/sample-commerce.questions.tsv --retrieval-only BM25,TREE,HYBRID --fail-under 0 | tee retrieval.txt
          python3 - <<'PY'
          import re
          text = open('retrieval.txt').read()
          scores = dict(zip(re.findall(r'RETRIEVAL \((\w+)\)', text),
                            [float(v) for v in re.findall(r'mean reciprocal rank\s+([0-9.]+)', text)]))
          print(scores)
          assert scores['HYBRID'] >= scores['BM25'], f"hybrid retrieval regressed against flat: {scores}"
          assert scores['TREE'] >= scores['BM25'], f"tree descent regressed against flat: {scores}"
          PY

      - name: An assistant may only navigate to ids it was shown
        run: |
          java -jar apps/cli/target/repo-intel.jar navigate fixtures/sample-commerce \
            "where are payments authorized?" --session nav.json > packet.txt
          grep -q 'Choose only ids that appear on the cards below' packet.txt
          if java -jar apps/cli/target/repo-intel.jar navigate fixtures/sample-commerce \
               --session nav.json --choose index:type:com.acme.checkout.PaymentGateway 2> rejected.txt; then
            echo 'an unpresented id was followed'; exit 1
          fi
          grep -q 'not on the cards presented' rejected.txt

      # This repository declares CodeGraph#edges(), which is exactly the shape that used to break
      # reading a graph back: the reader found "name":"edges" before the real edges array and
      # returned a graph with none. The fixture cannot catch it, so the gate analyzes this repo.
      - name: A graph file answers the same as the repository it came from
        run: |
          java -jar apps/cli/target/repo-intel.jar inspect . -o self.graph.json
          java -jar apps/cli/target/repo-intel.jar impact . Bm25Index --depth 2 > from-repo.txt
          java -jar apps/cli/target/repo-intel.jar impact self.graph.json Bm25Index --depth 2 > from-file.txt
          diff <(grep -E '^Direct:' from-repo.txt) <(grep -E '^Direct:' from-file.txt)
          grep -qv 'Direct: 0 | Transitive: 0' from-file.txt
          java -jar apps/cli/target/repo-intel.jar index . -o self-from-repo.tree.json
          java -jar apps/cli/target/repo-intel.jar index self.graph.json -o self-from-file.tree.json
          diff self-from-repo.tree.json self-from-file.tree.json

      - name: A snapshot round-trips and an unchanged tree diffs empty
        run: |
          java -jar apps/cli/target/repo-intel.jar snapshot fixtures/sample-commerce -o baseline.snapshot.json
          java -jar apps/cli/target/repo-intel.jar diff fixtures/sample-commerce baseline.snapshot.json | tee diff.txt
          grep -q '+0/-0 nodes, +0/-0 edges, 0 re-resolved' diff.txt

      - name: An answer cites its evidence and withholds the rest
        run: |
          java -jar apps/cli/target/repo-intel.jar ask fixtures/sample-commerce "what breaks if PaymentService changes?" | tee ask.txt
          grep -q 'SUPPORTED CLAIMS' ask.txt
          grep -q 'evidence:' ask.txt

      - name: Context packet stays smaller than the full graph
        run: |
          java -jar apps/cli/target/repo-intel.jar context fixtures/sample-commerce PaymentService -o context.json
          python3 - <<'PY'
          import json
          graph = json.load(open('first.graph.json'))
          packet = json.load(open('context.json'))
          assert graph['version'] == packet['version'], 'writers disagree on schema version'
          assert packet['evidence'], 'context packet carries no evidence'
          assert len(packet['evidence']) < len(graph['edges']), 'context packet is not a reduction'
          for edge in packet['evidence']:
              assert edge['file'] and edge['line'] > 0, edge
          PY
