name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
      - run: java -jar apps/cli/target/repo-intel.jar inspect fixtures/sample-commerce -o sample-commerce.graph.json
